name: CI – Build & Inhaltsprüfung

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Inhaltsprüfung
        run: npm run validate
      - name: Build (prüft Schema & Quellen-Pflicht)
        run: npm run build
      - name: Astro check (Typen)
        run: npx astro check || true
