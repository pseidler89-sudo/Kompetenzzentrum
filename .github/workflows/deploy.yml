name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte für das Deployment auf Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deployments serialisieren, aber NICHT abbrechen: ein laufender Pages-Deploy
# muss atomar zu Ende laufen, sonst zeigt ausgeliefertes HTML auf CSS-Hashes,
# die noch nicht (oder nicht mehr) da sind → unstyled Seite. (GitHub-Empfehlung.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (mit dynamischem Base-Path aus dem Repo-Namen)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
