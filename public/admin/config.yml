# Sveltia CMS – Redaktionsoberfläche für das Kompetenzzentrum.
# Doku: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: pseidler89-sudo/Kompetenzzentrum
  branch: main
  # OAuth-Vermittler (Cloudflare Worker) – ermöglicht den „Login mit GitHub“-Knopf.
  base_url: https://sveltia-cms-auth.p-seidler.workers.dev

# Beiträge landen zunächst als Entwurf/Pull-Request statt direkt auf main.
publish_mode: editorial_workflow

# Sprache der Oberfläche
locale: de

media_folder: "public/uploads"
public_folder: "/Kompetenzzentrum/uploads"

collections:
  - name: faktenchecks
    label: "Faktenchecks"
    label_singular: "Faktencheck"
    folder: "src/content/faktenchecks"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{titel}}  ·  {{urteil}}"
    fields:
      - { name: titel, label: "Titel", widget: string, hint: "Kurzer, klarer Titel – oft die Behauptung in Anführungszeichen." }
      - { name: behauptung, label: "Die Behauptung", widget: text, hint: "Die geprüfte Falschbehauptung, möglichst im Wortlaut." }
      - { name: kurzantwort, label: "Kurzantwort (Fakt zuerst)", widget: text, hint: "1–2 Sätze: der belegte Fakt. Steht ganz oben (Truth-Sandwich)." }
      - name: urteil
        label: "Urteil"
        widget: select
        default: "irrefuehrend"
        options:
          - { label: "Falsch", value: "falsch" }
          - { label: "Größtenteils falsch", value: "groesstenteils-falsch" }
          - { label: "Irreführend", value: "irrefuehrend" }
          - { label: "Fehlender Kontext", value: "fehlender-kontext" }
          - { label: "Teils richtig, teils falsch", value: "teils-richtig" }
      - name: themen
        label: "Themen"
        widget: select
        multiple: true
        min: 1
        options:
          - { label: "Migration & Asyl", value: "migration" }
          - { label: "Kriminalität & Sicherheit", value: "kriminalitaet-sicherheit" }
          - { label: "Klima & Energie", value: "klima-energie" }
          - { label: "Umwelt & Landwirtschaft", value: "umwelt-landwirtschaft" }
          - { label: "Wirtschaft & Soziales", value: "wirtschaft-soziales" }
          - { label: "Gesundheit", value: "gesundheit" }
          - { label: "Demokratie & Medien", value: "demokratie-medien" }
      - name: techniken
        label: "Manipulationstechniken"
        widget: select
        multiple: true
        required: false
        hint: "Welche Maschen stecken in der Behauptung?"
        options:
          - { label: "Schein-Expert:innen", value: "fake-experten" }
          - { label: "Logischer Fehlschluss", value: "logischer-fehlschluss" }
          - { label: "Unerfüllbare Erwartung", value: "unerfuellbare-erwartung" }
          - { label: "Rosinenpickerei (Cherry Picking)", value: "cherry-picking" }
          - { label: "Verschwörungserzählung", value: "verschwoerung" }
          - { label: "Falsche Ursache-Wirkung", value: "falsche-kausalitaet" }
          - { label: "Fehlender Bezugswert", value: "fehlender-bezugswert" }
          - { label: "Emotionalisierung", value: "emotionalisierung" }
          - { label: "Falsche Gleichsetzung", value: "falsche-gleichsetzung" }
          - { label: "Aus dem Kontext gerissen", value: "aus-dem-kontext-gerissen" }
          - { label: "Whataboutism", value: "whataboutism" }
          - { label: "Falsche Verknüpfung (Clickbait)", value: "falsche-verknuepfung" }
          - { label: "Astroturfing", value: "astroturfing" }
          - { label: "Identitätsschwindel", value: "identitaetsschwindel" }
          - { label: "Falsche Ausgewogenheit (False Balance)", value: "falsche-ausgewogenheit" }
          - { label: "Gish-Galopp (Behauptungs-Flut)", value: "gish-galopp" }
          - { label: "Mehrheits-Argument (Bandwagon)", value: "bandwagon" }
          - { label: "Sündenbock", value: "suendenbock" }
          - { label: "Lügen-Flut (Firehose)", value: "firehose" }
      - { name: zusammenfassung, label: "Kurzbeschreibung (für Vorschau & Suchmaschinen)", widget: text, pattern: ['^.{1,300}$', "Höchstens 300 Zeichen."] }
      - name: status
        label: "Redaktioneller Status"
        widget: select
        default: "entwurf"
        options:
          - { label: "Entwurf", value: "entwurf" }
          - { label: "In Prüfung", value: "in-pruefung" }
          - { label: "Geprüft", value: "geprueft" }
      - { name: veroeffentlicht, label: "Veröffentlicht am", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: aktualisiert, label: "Aktualisiert am", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { name: mitwirkende, label: "Mitwirkende", widget: list, required: false, default: [], hint: "Namen oder GitHub-Handles." }

      - name: quellen
        label: "Quellen"
        label_singular: "Quelle"
        widget: list
        min: 1
        summary: "{{fields.herausgeber}} – {{fields.titel}}"
        hint: "Jede zentrale Aussage braucht einen Beleg. Amtliche Primärquellen bevorzugen."
        fields:
          - { name: titel, label: "Titel der Quelle", widget: string }
          - { name: herausgeber, label: "Herausgeber", widget: string, hint: "z. B. Statistisches Bundesamt, BKA, Bundesnetzagentur" }
          - { name: url, label: "Link (URL)", widget: string, required: false, pattern: ['^https?://.+', "Bitte eine vollständige URL (https://…)"] }
          - { name: datum, label: "Datum/Jahr", widget: string, required: false }
          - name: art
            label: "Art"
            widget: select
            default: "sekundaer"
            options:
              - { label: "Primärquelle (amtlich/original)", value: "primaer" }
              - { label: "Sekundärquelle", value: "sekundaer" }

      - name: verwandt
        label: "Verwandte Faktenchecks"
        widget: relation
        required: false
        multiple: true
        collection: faktenchecks
        value_field: "{{slug}}"
        search_fields: ["titel"]
        display_fields: ["titel"]
        hint: "Optional: thematisch verwandte Beiträge zum Verlinken."

      # ---- Inhalt: Einleitung + drei Tiefen + Technik + Prüfen ----
      - { name: einleitung, label: "Einleitung (Fakt zuerst)", widget: markdown, required: false, hint: "Ein einleitender Absatz – beginnt mit dem belegten Stand, nicht mit dem Mythos." }
      - { name: einstieg, label: "① Einstieg", widget: markdown, hint: "Kurz & verständlich, ganz ohne Vorwissen." }
      - { name: vertiefung, label: "② Vertiefung", widget: markdown, hint: "Die Zahlen dahinter und die Zusammenhänge." }
      - { name: wissenschaftlich, label: "③ Wissenschaftlich", widget: markdown, hint: "Primärquellen, Methodik, statistische Fallstricke." }
      - { name: technik_titel, label: "Technik – Titel", widget: string, required: false, hint: "z. B. „Cherry Picking & fehlender Bezugswert“" }
      - { name: technik_text, label: "Technik – Erklärung", widget: markdown, required: false, hint: "Welche Manipulationstechnik steckt dahinter?" }
      - { name: pruefen, label: "So prüfst du das selbst", widget: markdown, required: false, hint: "Konkrete Schritte zum Selber-Nachprüfen (gern als Liste)." }

      - name: daten
        label: "Datengrafiken (optional)"
        label_singular: "Grafik"
        widget: list
        required: false
        summary: "{{fields.typ}} – {{fields.titel}}"
        hint: "Nur wo eine Grafik eine Zahl/Beziehung trägt – nie Dekoration. Jede Grafik braucht eine Quelle."
        fields:
          - name: typ
            label: "Typ"
            widget: select
            default: "vergleich"
            options:
              - { label: "Vergleich (Balken nebeneinander)", value: "vergleich" }
              - { label: "Anteil am Ganzen", value: "anteil" }
              - { label: "Zusammensetzung (gestapelt, Summe 100)", value: "zusammensetzung" }
              - { label: "Kennzahl (große Zahl)", value: "kennzahl" }
          - { name: titel, label: "Titel", widget: string, required: false, hint: "Darf <strong>…</strong> für Hervorhebung enthalten." }
          - { name: hinweis, label: "Hinweis", widget: string, required: false }
          - { name: quelle, label: "Quelle", widget: string, required: false }
          - { name: primaer, label: "Primärquelle (amtlich/original)", widget: boolean, default: false, required: false }
          - { name: skala, label: "Achsen-Maximum (leer = automatisch)", widget: number, required: false, value_type: float }
          - name: werte
            label: "Werte"
            label_singular: "Wert"
            widget: list
            summary: "{{fields.label}}: {{fields.wert}}"
            fields:
              - { name: label, label: "Label", widget: string, required: false }
              - { name: sublabel, label: "Unterzeile", widget: string, required: false }
              - { name: wert, label: "Wert (Zahl)", widget: number, value_type: float }
              - { name: einheit, label: "Einheit", widget: string, default: "%", required: false }
              - name: farbe
                label: "Farbe"
                widget: select
                default: "neutral"
                options:
                  - { label: "Akzent (Kernzahl)", value: "accent" }
                  - { label: "Neutral (Vergleich)", value: "neutral" }
                  - { label: "Falsch", value: "falsch" }
                  - { label: "Irreführend", value: "irrefuehrend" }
                  - { label: "Fehlender Kontext", value: "kontext" }
                  - { label: "Teils richtig", value: "teils" }
                  - { label: "Prüfen", value: "pruefen" }

  - name: maschen
    label: "Maschen (Manipulationstechniken)"
    label_singular: "Masche"
    folder: "src/content/maschen"
    create: true
    slug: "{{fields.code}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{titel}}"
    hint: "Eine Manipulationstechnik mit aktuellem Beispiel und Tipps zum Durchschauen."
    fields:
      - { name: titel, label: "Titel der Masche", widget: string }
      - name: code
        label: "Technik-Code (verknüpft mit Faktenchecks)"
        widget: select
        hint: "Muss exakt einem Technik-Code entsprechen. Der Dateiname wird daraus gebildet."
        options:
          - { label: "Schein-Expert:innen", value: "fake-experten" }
          - { label: "Logischer Fehlschluss", value: "logischer-fehlschluss" }
          - { label: "Unerfüllbare Erwartung", value: "unerfuellbare-erwartung" }
          - { label: "Rosinenpickerei (Cherry Picking)", value: "cherry-picking" }
          - { label: "Verschwörungserzählung", value: "verschwoerung" }
          - { label: "Falsche Ursache-Wirkung", value: "falsche-kausalitaet" }
          - { label: "Fehlender Bezugswert", value: "fehlender-bezugswert" }
          - { label: "Emotionalisierung", value: "emotionalisierung" }
          - { label: "Falsche Gleichsetzung", value: "falsche-gleichsetzung" }
          - { label: "Aus dem Kontext gerissen", value: "aus-dem-kontext-gerissen" }
          - { label: "Whataboutism", value: "whataboutism" }
          - { label: "Falsche Verknüpfung (Clickbait)", value: "falsche-verknuepfung" }
          - { label: "Astroturfing", value: "astroturfing" }
          - { label: "Identitätsschwindel", value: "identitaetsschwindel" }
          - { label: "Falsche Ausgewogenheit (False Balance)", value: "falsche-ausgewogenheit" }
          - { label: "Gish-Galopp (Behauptungs-Flut)", value: "gish-galopp" }
          - { label: "Mehrheits-Argument (Bandwagon)", value: "bandwagon" }
          - { label: "Sündenbock", value: "suendenbock" }
          - { label: "Lügen-Flut (Firehose)", value: "firehose" }
      - name: kategorie
        label: "Kategorie"
        widget: select
        default: "rhetorik"
        options:
          - { label: "FLICC-Kerntechnik", value: "flicc" }
          - { label: "Häufiges rhetorisches Muster", value: "rhetorik" }
      - { name: kurz, label: "Kurzbeschreibung (ein Satz)", widget: text }
      - { name: reihenfolge, label: "Reihenfolge", widget: number, default: 99, value_type: int }
      - { name: so_funktionierts, label: "So funktioniert die Masche", widget: markdown }
      - { name: beispiel, label: "Aktuelles Beispiel", widget: markdown, required: false }
      - name: beispiel_quelle
        label: "Beleg fürs Beispiel"
        widget: object
        required: false
        fields:
          - { name: titel, label: "Titel der Quelle", widget: string }
          - { name: herausgeber, label: "Herausgeber", widget: string }
          - { name: url, label: "Link", widget: string, required: false }
          - { name: datum, label: "Datum/Jahr", widget: string, required: false }
          - name: art
            label: "Art"
            widget: select
            default: "sekundaer"
            options:
              - { label: "Primärquelle", value: "primaer" }
              - { label: "Sekundärquelle", value: "sekundaer" }
      - { name: durchschauen, label: "So durchschaust du es", widget: markdown, hint: "Konkrete Prüf-Fragen, gern als Liste." }

  - name: methodik
    label: "Methodik-Artikel"
    label_singular: "Methodik-Artikel"
    folder: "src/content/methodik"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: titel, label: "Titel", widget: string }
      - { name: zusammenfassung, label: "Kurzbeschreibung", widget: text }
      - { name: reihenfolge, label: "Reihenfolge", widget: number, default: 99, value_type: int }
      - { name: aktualisiert, label: "Aktualisiert am", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { name: body, label: "Inhalt", widget: markdown }
